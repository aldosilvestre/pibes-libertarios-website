<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380">
  <defs>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#4a3004"/><stop offset=".25" stop-color="#c8961e"/><stop offset=".45" stop-color="#fff0a8"/><stop offset=".6" stop-color="#d9a52a"/><stop offset="1" stop-color="#3e2802"/>
    </linearGradient>
    <radialGradient id="face" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#fff4c2"/><stop offset=".3" stop-color="#f0c24a"/><stop offset=".75" stop-color="#a87510"/><stop offset="1" stop-color="#5c3d04"/>
    </radialGradient>
    <radialGradient id="faceBig" cx=".3" cy=".25" r="1">
      <stop offset="0" stop-color="#fff6cc"/><stop offset=".35" stop-color="#eebd3e"/><stop offset=".8" stop-color="#9a6a0c"/><stop offset="1" stop-color="#4e3302"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="emboss">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="b"/>
      <feSpecularLighting in="b" surfaceScale="3" specularConstant=".9" specularExponent="18" lighting-color="#fff6d0" result="s"><feDistantLight azimuth="225" elevation="40"/></feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="sc"/>
      <feOffset in="SourceAlpha" dx="1.2" dy="1.6" result="o"/><feFlood flood-color="#3a2400" flood-opacity=".75"/><feComposite in2="o" operator="in" result="dk"/>
      <feMerge><feMergeNode in="dk"/><feMergeNode in="SourceGraphic"/><feMergeNode in="sc"/></feMerge>
    </filter>
    <path id="arcTop" d="M322 262 A70 44 0 0 1 462 262"/>
    <path id="arcBot" d="M312 270 A80 56 0 0 0 472 270"/>
  </defs>
  <ellipse cx="190" cy="330" rx="120" ry="36" fill="#000" opacity=".6" filter="url(#soft)"/>
  <ellipse cx="410" cy="300" rx="112" ry="40" fill="#000" opacity=".55" filter="url(#soft)"/>
  <ellipse cx="160" cy="312" rx="92" ry="30" fill="url(#edge)"/><ellipse cx="160" cy="300" rx="92" ry="30" fill="url(#face)"/><ellipse cx="160" cy="299" rx="92" ry="30" fill="url(#edge)"/><ellipse cx="160" cy="287" rx="92" ry="30" fill="url(#face)"/><ellipse cx="160" cy="286" rx="92" ry="30" fill="url(#edge)"/><ellipse cx="160" cy="274" rx="92" ry="30" fill="url(#face)"/><ellipse cx="160" cy="273" rx="92" ry="30" fill="url(#edge)"/><ellipse cx="160" cy="261" rx="92" ry="30" fill="url(#face)"/><ellipse cx="160" cy="260" rx="92" ry="30" fill="url(#edge)"/><ellipse cx="160" cy="248" rx="92" ry="30" fill="url(#face)"/><ellipse cx="160" cy="247" rx="92" ry="30" fill="url(#edge)"/><ellipse cx="160" cy="235" rx="92" ry="30" fill="url(#face)"/><ellipse cx="160" cy="234" rx="92" ry="30" fill="url(#edge)"/><ellipse cx="160" cy="222" rx="92" ry="30" fill="url(#face)"/><ellipse cx="160" cy="221" rx="92" ry="30" fill="url(#edge)"/><ellipse cx="160" cy="209" rx="92" ry="30" fill="url(#face)"/>
  <!-- moneda suelta -->
  <ellipse cx="392" cy="276" rx="104" ry="74" fill="url(#edge)"/>
  <ellipse cx="392" cy="268" rx="104" ry="74" fill="url(#faceBig)"/>
  <ellipse cx="392" cy="268" rx="94" ry="66" fill="none" stroke="#7a5208" stroke-width="2"/>
  <ellipse cx="392" cy="268" rx="90" ry="63" fill="none" stroke="#fff2b8" stroke-width="1" opacity=".6"/>
  <g filter="url(#emboss)" fill="#c99a2e">
    <text font-family="Georgia,serif" font-weight="700" font-size="17" letter-spacing="4"><textPath href="#arcTop" startOffset="50%" text-anchor="middle">LIBERTAD</textPath></text>
    <text font-family="Georgia,serif" font-size="11" letter-spacing="3"><textPath href="#arcBot" startOffset="50%" text-anchor="middle">ORO PURO · 1 ONZA</textPath></text>
    <!-- antorcha -->
    <path d="M392 236 c-10 10 -10 20 0 26 c10 -6 10 -16 0 -26z M385 262 h14 l-3 6 h-8z M388 268 h8 l-2 30 h-4z"/>
    <path d="M352 292 c10 -2 22 -12 28 -24 M432 292 c-10 -2 -22 -12 -28 -24" fill="none" stroke="#c99a2e" stroke-width="3"/>
  </g>
  <ellipse cx="392" cy="268" rx="104" ry="74" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="90 600" stroke-dashoffset="-470"/>
</svg>