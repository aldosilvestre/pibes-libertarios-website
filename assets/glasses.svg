<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300">
  <defs>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff3c0"/><stop offset=".3" stop-color="#d9a92e"/><stop offset=".6" stop-color="#7a5208"/><stop offset=".85" stop-color="#e8c060"/><stop offset="1" stop-color="#5a3a04"/>
    </linearGradient>
    <radialGradient id="lens" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#cfe6ff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="cl"><ellipse cx="150" cy="170" rx="96" ry="74"/></clipPath>
    <clipPath id="cr"><ellipse cx="372" cy="170" rx="96" ry="74"/></clipPath>
  </defs>
  <!-- sombras sobre la mesa (luz desde arriba a la izquierda) -->
  <g transform="translate(18 20)" opacity=".5" filter="url(#sh)" fill="none" stroke="#000" stroke-width="7">
    <ellipse cx="150" cy="170" rx="96" ry="74"/><ellipse cx="372" cy="170" rx="96" ry="74"/>
    <path d="M70 128 L30 40 M452 128 L500 36"/>
  </g>
  <!-- cristales -->
  <ellipse cx="150" cy="170" rx="96" ry="74" fill="url(#lens)"/>
  <ellipse cx="372" cy="170" rx="96" ry="74" fill="url(#lens)"/>
  <g clip-path="url(#cl)"><rect x="40" y="70" width="40" height="220" fill="url(#streak)" transform="rotate(32 150 170)"/><rect x="120" y="70" width="14" height="220" fill="url(#streak)" transform="rotate(32 150 170)"/></g>
  <g clip-path="url(#cr)"><rect x="262" y="70" width="40" height="220" fill="url(#streak)" transform="rotate(32 372 170)"/><rect x="342" y="70" width="14" height="220" fill="url(#streak)" transform="rotate(32 372 170)"/></g>
  <!-- patillas -->
  <path d="M60 140 C52 110 40 70 28 38" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <path d="M462 140 C472 110 486 70 498 36" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <path d="M28 38 q-6 -14 6 -20" fill="none" stroke="#2a1a08" stroke-width="7" stroke-linecap="round"/>
  <path d="M498 36 q6 -14 -6 -20" fill="none" stroke="#2a1a08" stroke-width="7" stroke-linecap="round"/>
  <!-- aros y puente -->
  <ellipse cx="150" cy="170" rx="96" ry="74" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <ellipse cx="372" cy="170" rx="96" ry="74" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <path d="M240 150 C252 128 270 128 282 150" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="150" cy="170" rx="96" ry="74" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="60 400" stroke-dashoffset="-330"/>
  <ellipse cx="372" cy="170" rx="96" ry="74" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="60 400" stroke-dashoffset="-330"/>
</svg>
